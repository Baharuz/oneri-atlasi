services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onerici
      POSTGRES_USER: onerici
      POSTGRES_PASSWORD: onerici
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onerici"]
      interval: 3s
      retries: 10
volumes:
  pgdata:
